name: Sync to Hugging Face
on:
  push:
    branches: [main]
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Push to hub fresh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf .git
          rm -rf venv
          git init
          git branch -m main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git lfs install
          git lfs track "*.pkl"
          git add .gitattributes
          git add .
          git commit -m "Fresh deploy to Hugging Face"
          git push --force https://StudentRisk:${HF_TOKEN}@huggingface.co/spaces/StudentRisk/student-risk-app main